[package]
name = "break-your-keyboard"
version = "0.1.0"
description = "按住说话、松手出字的语音输入工具（M1）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "break_your_keyboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"

# ---- 平台相关依赖（macOS）。Windows 移植时在此添加对应 cfg 分支。 ----
[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5"
enigo = "0.2"
arboard = "3"
