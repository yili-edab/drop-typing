[package]
name = "drop-typing"
version = "0.1.0"
description = "按住说话、松手出字的语音输入工具（M1）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "drop_typing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
hound = "3.5"

# ---- 平台相关依赖（macOS）。Windows 移植时在此添加对应 cfg 分支。 ----
[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5"
enigo = "0.2"
arboard = "3"

# drop-typing: vendor rdev 0.5.3 补丁 —— 移除 CGEventTap 后台线程中对 TIS/TSM
# 输入法 API 的调用（macOS 26 主线程断言导致 EXC_BREAKPOINT）。详见
# vendor/rdev/src/macos/common.rs 中的 "drop-typing patch" 注释。
# 注意：cargo update 时 rdev 会被锁定在 0.5.3；若上游修复可移除此 patch。
[patch.crates-io]
rdev = { path = "vendor/rdev" }
