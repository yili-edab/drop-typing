# drop-typing 配置示例
#
# 复制为家目录下的点文件后填写：
#   cp config.example.toml ~/.drop-typing.toml
#
# 约定：provider 是厂商名（分组/文档用），protocol 决定代码使用哪个协议适配器。
# API Key 也可以用环境变量 DASHSCOPE_API_KEY 提供（优先级低于配置文件）。

# ASR（语音识别）—— 阿里百炼实时识别
[asr]
provider = "bailian"
protocol = "dashscope-realtime"   # DashScope 原生 WebSocket 流式协议
model = "fun-asr-realtime"
base_url = "wss://your-workspace.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 备选：百炼 HTTP 同步识别（qwen3-asr-flash，M1 方案）
# [asr]
# provider = "bailian"
# protocol = "dashscope-http"     # HTTP 同步接口
# model = "qwen3-asr-flash"
# api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# LLM（文本清洗，M2）—— 不配置本节或缺 api_key 时关闭清洗，ASR 直出
#
# 方案一：百炼 Anthropic 兼容端点
# [llm]
# provider = "bailian"
# protocol = "anthropic-messages" # Anthropic Messages API 兼容协议
# base_url = "https://your-workspace.cn-beijing.maas.aliyuncs.com/apps/anthropic"
# model = "claude-sonnet-4-5"     # 按工作区可用模型填写
# api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#
# 方案二：OpenAI 兼容协议（DeepSeek 默认，protocol 缺省即 openai-chat）
# [llm]
# provider = "deepseek"
# protocol = "openai-chat"        # base_url / model 缺省为 DeepSeek 官方端点
# api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#
# 优化强度档位（缺省 standard）：
#   conservative = 只加标点，不改语序措辞
#   standard     = 去口水词 + 标点 + 中英空格 + 适度结构化
# strength = "standard"

# 长按判定阈值（毫秒，默认 150）：按下右 ⌘ 达到该时长视为长按（录音），
# 松开时不足该时长视为短按（提交暂存条）。
# long_press_threshold_ms = 150

# 双击窗口（毫秒，默认 350）：第一次短按松手后，在该时长内再次短按松手
# 视为双击（清空暂存条）；超时未等到第二击则确认为单击（提交暂存条）。
# double_press_window_ms = 350

# 语音指令确认倒计时（毫秒，默认 1000）：长按右 ⇧ 说出按键指令（如"复制"、
# "Shift Command E"）解析完成后，在暂存条上大字展示指令并倒计时，到 0 自动模拟
# 该按键；倒计时期间按下任意右修饰键（开始新录音）可取消执行。
# command_countdown_ms = 1000

# ── 唤醒词（sherpa-onnx KeywordSpotter）────────────────────────────
#
# 开启后应用持续监听麦克风，通过唤醒词免提触发语音输入。
# 使用 sherpa-onnx Zipformer Transducer KWS 模型，内建特征提取，
# 无需自行训练模型或维护 Mel 特征提取代码。
#
# ⚠️ macOS 限制：麦克风持续开流会导致菜单栏橙色指示灯常亮。
#    本功能仅用于验证语音交互体验，非长期使用方案。
#
# 预训练模型下载（中英双语，约 3.3MB）：
#   https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
#
# 放在 src-tauri/models/builtin/ 目录下，首次启动自动加载。
# 也可用 model_dir 指定文件系统路径。

# [wakeword]
# enabled = true
# model_dir = "sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"  # 内置模型目录名
# keywords_threshold = 0.25       # 检测阈值（默认 0.25，越低越灵敏但误触高）
# keywords_score = 1.0            # 唤醒词 score boost
# silence_timeout_ms = 1500       # 唤醒后静音判定录音结束
# pre_roll_ms = 500               # 唤醒词前保留的音频时长
# ring_buffer_duration_ms = 3000  # 环形缓冲区时长
#
# # 自定义唤醒词列表（缺省时使用内置默认值 小易记/小易修/小易控/小易确认/小易清空）
# [[wakeword.keywords]]
# keyword = "小易记"             # 自然语言关键词
# action = "input"                # → 录入通道
#
# [[wakeword.keywords]]
# keyword = "小易修"
# action = "repair"               # → 修复通道
#
# [[wakeword.keywords]]
# keyword = "小易控"
# action = "command"              # → 指令通道
#
# [[wakeword.keywords]]
# keyword = "小易确认"
# action = "commit"               # → 立即提交暂存条（不录音）
#
# [[wakeword.keywords]]
# keyword = "小易清空"
# action = "clear"                # → 清空暂存条并隐藏（不录音）

# -----------------------------------------------------------
# 音频输入设备（可选，定制硬件：USB 麦克风选择）
#
# 指定后应用使用该输入设备录音；设备未连接时自动回退系统默认输入设备，
# 插回后自动优先用回。缺省（不配置本节）时始终跟随系统默认。
# 设备名可在「设置 → 定制硬件」中查看与选择。

# [audio]
# input_device = "Drop Mic"       # 例如自有 USB 麦克风的设备名

# -----------------------------------------------------------
# 快捷键自定义（可选，未配置时使用平台默认值）
#
# macOS 端每个通道为一个单键；Windows 端为由修饰键家族（Control/Meta/Alt/Shift）
# 组成的多键组合——所有列出的键必须同时按住才触发。
#
# 键名（大小写不敏感）：
#   家族名（匹配左右任意变体）    Control/Ctrl, Meta/Win/Cmd, Alt/Opt, Shift
#   精确键（仅匹配该物理键）      ControlLeft/ControlRight, MetaLeft/MetaRight,
#                               AltGr, ShiftLeft/ShiftRight, Escape/Esc,
#                               Space, Tab, Return/Enter, Backspace, Delete,
#                               KeyA..KeyZ, Num0..Num9, F1..F12,
#                               Up/Down/Left/Right 等
#
# 注意：Windows 端三个功能通道支持修饰键家族名（左右任意）或精确修饰键名
# （如 MetaRight/AltGr/ControlRight/ShiftRight，区分左右），cancel 支持任意键名。
# -----------------------------------------------------------

# ── 鼠标侧键（缺省绑定前进→录入、后退→修复）──
# 鼠标侧键与键盘快捷键独立工作，互不干扰。
# 在 [hotkey] 下正常配置键盘快捷键，再添加 [hotkey.mouse] 段即可自定义侧键：
#
#   [hotkey]
#   trigger = ["MetaRight"]
#   repair  = ["AltGr"]
#   command = ["ShiftRight"]
#   cancel  = ["Escape"]
#
#   [hotkey.mouse]
#   trigger = "forward"   # 前进键（X2 / Button 5），长按录音、短按提交
#   repair  = "back"      # 后退键（X1 / Button 4），长按说修正指令
#
# 不写 [hotkey.mouse] 段时默认启用前进→录入、后退→修复。

# ── macOS 默认（单键）──
# [hotkey]
# trigger = ["MetaRight"]     # 右 ⌘：长按录音，短按确认
# repair  = ["AltGr"]         # 右 ⌥：长按语音修复
# command = ["ShiftRight"]    # 右 ⇧：长按语音指令
# cancel  = ["Escape"]        # Esc：清空暂存条

# ── Windows 默认（Alt/Win 组合键）──
# 默认键已避开已知冲突：Ctrl+Win（微信语音输入）、Shift+Alt（系统输入语言切换）。
# 若仍与其它软件撞键，改本段即可；或去对方软件中改它的快捷键。
# [hotkey]
# trigger = ["Meta", "Alt"]       # Win+Alt：长按录音，短按确认
# repair  = ["Control", "Alt"]    # Ctrl+Alt：长按语音修复
# command = ["Meta", "Shift"]     # Win+Shift：长按电脑控制（语音指令）
# cancel  = ["Escape"]            # Esc：清空暂存条

# ── 自定义示例：macOS 用左 ⌘ + Space 作为输入键 ──
# [hotkey]
# trigger = ["MetaLeft"]     # 仅左 ⌘（而非默认的右 ⌘）
# repair  = ["AltGr"]
# command = ["ShiftRight"]
# cancel  = ["Escape"]

# ── 自定义示例：Windows 仅用右侧修饰键组合 ──
# [hotkey]
# trigger = ["ControlRight", "MetaRight"]
# repair  = ["MetaRight", "AltGr"]
# command = ["MetaRight", "ShiftRight"]
# cancel  = ["Escape"]

# -----------------------------------------------------------
# 语音指令词表自定义（M4 指令通道）
#
# 未配置任何段时使用内置词表。用户追加的条目优先匹配，内置兜底。
#
# 修饰键（大小写不敏感）：
#   Cmd  → ⌘ Command
#   Opt  → ⌥ Option
#   Ctrl → ⌃ Control
#   Shift→ ⇧ Shift
# 精确键（区分左右修饰键时使用）：
#   CmdLeft/CmdRight、MetaLeft/MetaRight、OptLeft/OptRight、
#   Alt（左 Opt）/ AltGr（右 Opt）、CtrlLeft/CtrlRight、ControlLeft/ControlRight、
#   ShiftLeft/ShiftRight
#
# 键名（统一大写）：
#   字母/数字     A-Z, 0-9
#   功能键        ENTER, SPACE, TAB, ESC, DELETE
#   方向键        UP, DOWN, LEFT, RIGHT
#   F 键          F1, F2 ... F12
#
# 五种条目类型：
#   [[command.action]]    动作别名：说“截图” → 按 Shift+Cmd+4
#   [[command.modifier]]  修饰键别名：说“win” → 识别为 Cmd
#   [[command.key]]       按键别名：说“去除” → 识别为 DELETE
#   [[command.stop]]      停用词：说“给我按复制”中的“给我”被丢弃
#   [[command.homophone]] 字母谐音：ASR 把字母 A 识别成“挨”时的映射
# -----------------------------------------------------------

# [command]
# # countdown_ms = 3000  # 可选，覆盖上方的 command_countdown_ms

# # 动作别名
# [[command.action]]
# phrase = "截图"
# modifiers = ["Shift", "Cmd"]
# key = "4"
#
# # 动作别名（脚本执行）：说“跑备份” → 执行脚本（不模拟按键）。
# # script 支持两种写法：
# #   - 已存在的脚本文件路径（绝对路径或 ~ 开头，按 shebang 执行，需 chmod +x）
# #   - 一行 shell 命令，如 "open https://example.com"（macOS 交给 /bin/zsh -lc；
# #     Windows 交给 cmd.exe /C 执行，如 "start https://example.com"）
# [[command.action]]
# phrase = "跑备份"
# modifiers = []
# key = "C"
# script = "/path/to/backup.sh"

# # 修饰键别名
# [[command.modifier]]
# phrase = "win"
# modifier = "Cmd"

# # 按键别名
# [[command.key]]
# phrase = "去除"
# name = "DELETE"

# # 停用词
# [[command.stop]]
# phrase = "给我"

# # 字母谐音
# [[command.homophone]]
# phrase = "挨"
# letter = "A"
