# Break Your Keyboard 配置示例
#
# 复制为家目录下的点文件后填写：
#   cp config.example.toml ~/.break-your-keyboard.toml
#
# 也可以用环境变量 DASHSCOPE_API_KEY 提供 Key（优先级低于配置文件）。

# 阿里百炼 DashScope API Key（必填）
# 获取地址：https://bailian.console.aliyun.com/
dashscope_api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ASR 模型（默认 qwen3-asr-flash，一般无需修改）
# asr_model = "qwen3-asr-flash"

# 长按判定阈值（毫秒，默认 250）：按下右 ⌘ 达到该时长视为长按（录音），
# 松开时不足该时长视为短按（提交暂存条）。
# long_press_threshold_ms = 250
