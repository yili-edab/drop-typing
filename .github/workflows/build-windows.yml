name: Build Windows

# 触发条件：
#   1. push 到 main/master 分支 —— 验证 Windows 编译是否通过
#   2. 打 v* 标签 —— 构建并创建 GitHub Release（草稿）
#   3. PR —— CI 检查
#   4. 手动触发
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Run Rust unit tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Copy wakeword models next to raw exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/target/release/models | Out-Null
          Copy-Item -Path src-tauri/models/* -Destination src-tauri/target/release/models -Recurse -Force

      - name: Verify NSIS bundle exists
        shell: pwsh
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "缺少 NSIS 安装包，请检查 tauri.windows.conf.json" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drop-typing-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/drop-typing.exe
            src-tauri/target/release/models/**/*.onnx
            src-tauri/target/release/models/**/*.txt
            src-tauri/target/release/models/**/*.json
            src-tauri/target/release/models/**/*.phone
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/drop-typing.exe
            src-tauri/target/release/models/**/*.onnx
            src-tauri/target/release/models/**/*.txt
            src-tauri/target/release/models/**/*.json
            src-tauri/target/release/models/**/*.phone
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
